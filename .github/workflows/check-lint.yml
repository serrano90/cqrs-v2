name: Lint

on:
  push:
    branches: [master]
  pull_request:

jobs:
  golangci-lint:
    runs-on: ubuntu-latest

    steps:

    - name: Check out source code
      uses: actions/checkout@v5

    - name: Install dependencies
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: latest
