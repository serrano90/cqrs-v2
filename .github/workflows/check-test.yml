name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:

    - name: Check out source code
      uses: actions/checkout@v7

    - name: Install dependencies
      uses: actions/setup-go@v7
      with:
        go-version: '1.26'

    - name: Test
      env:
        GOPROXY: "https://proxy.golang.org"
      run: go test -v ./...
